openapi: 3.1.0
info:
  title: Anixart API
  description: 'This is an unofficial OpenAPI specification of [Anixart](https://anixart-app.com)
    API


    Based on Anixart 9.0 beta 9


    Some of type definitions and endpoints are taken and converted from [AnixartJS](https://github.com/theDesConnet/AnixartJS)
    library


    Made by [@Radiquum](https://wah.su/radiquum) at [@Anix-Org](https://github.com/AniX-org)

    '
  version: 9.0 beta 9
paths:
  /config/toggles:
    get:
      tags:
      - Config
      summary: Get toggles
      description: Get dynamic app configuration toggles
      operationId: configToggles
      parameters:
      - name: version_code
        in: query
        description: app version code
        required: true
        schema:
          type: integer
          example: 1
      - name: is_beta
        in: query
        description: is beta version
        required: true
        schema:
          type: boolean
          example: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IConfigTogglesResponse'
      security:
      - token: []
  /config/urls:
    get:
      tags:
      - Config
      summary: Get urls
      description: 'Get alternative api urls


        Also they are taken from GitHub [urls.json](https://raw.githubusercontent.com/AnixHelper/pages/refs/heads/main/urls.json)

        '
      operationId: configUrls
      parameters:
      - name: version_code
        in: query
        description: app version code
        required: true
        schema:
          type: integer
          example: 1
      - name: is_beta
        in: query
        description: is beta version
        required: true
        schema:
          type: boolean
          example: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IConfigUrlsResponse'
      security:
      - token: []
  /auth/signIn:
    post:
      tags:
      - Auth
      summary: Sign in
      description: Sign in to account and get a token
      operationId: authSignIn
      parameters:
      - $ref: '#/components/parameters/IParameterLogin'
      - $ref: '#/components/parameters/IParameterPassword'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ILoginResponse'
  /auth/signUp:
    post:
      tags:
      - Auth
      summary: Sign up
      description: Sign up new account and get a verify code
      operationId: authSignUp
      parameters:
      - $ref: '#/components/parameters/IParameterEmail'
      - $ref: '#/components/parameters/IParameterLogin'
      - $ref: '#/components/parameters/IParameterPassword'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IRegisterResponse'
  /auth/verify:
    post:
      tags:
      - Auth
      summary: Verify sign up
      description: verify sign up of an account and get a token
      operationId: authVerify
      parameters:
      - $ref: '#/components/parameters/IParameterEmail'
      - $ref: '#/components/parameters/IParameterLogin'
      - $ref: '#/components/parameters/IParameterPassword'
      - $ref: '#/components/parameters/IParameterHash'
      - $ref: '#/components/parameters/IParameterCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IRegisterVerifyResponse'
  /auth/restore:
    post:
      tags:
      - Auth
      summary: Restore a password
      description: Send a verify code to restore a password
      operationId: authRestore
      parameters:
      - $ref: '#/components/parameters/IParameterLogin'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IRestoreResponse'
  /auth/restore/verify:
    post:
      tags:
      - Auth
      summary: verify a password reset
      description: verify a password reset for account and get a token
      operationId: authRestoreVerify
      parameters:
      - $ref: '#/components/parameters/IParameterLogin'
      - $ref: '#/components/parameters/IParameterPassword'
      - $ref: '#/components/parameters/IParameterHash'
      - $ref: '#/components/parameters/IParameterCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IRestoreVerifyResponse'
  /discover/watching/{page}:
    get:
      tags:
      - Discover
      summary: Watching now
      description: Get currently watching releases by users
      operationId: discoverWatching
      parameters:
      - $ref: '#/components/parameters/IParameterQueryPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IReleasesPagedResponse'
      security:
      - token: []
  /discover/discussing:
    get:
      tags:
      - Discover
      summary: Most discussing releases
      description: Get 5 currently most discussing releases by users
      operationId: discoverDiscussing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IReleasesPagedResponse'
      security:
      - token: []
  /discover/recommendations/{page}:
    get:
      tags:
      - Discover
      summary: Get recommendations list
      description: Get recommendations list. Authentication is required
      operationId: discoverRecommendations
      parameters:
      - $ref: '#/components/parameters/IParameterQueryPage'
      - $ref: '#/components/parameters/IParameterPreviousPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IReleasesPagedResponse'
      security:
      - token: []
  /discover/interesting:
    get:
      tags:
      - Discover
      summary: Interesting releases
      description: Get currently Interesting releases by users
      operationId: discoverInteresting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDiscoverInterestingResponse'
      security:
      - token: []
  /discover/comments:
    get:
      tags:
      - Discover
      summary: Get popular comments
      description: Get 10 popular comments
      operationId: discoverComments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ICommentReleasePagedResponse'
      security:
      - token: []
  /notification/count:
    get:
      tags:
      - Notification
      summary: Count unread notifications
      description: Get count of unread notifications
      operationId: notificationCount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INotificationCountResponse'
      security:
      - token: []
  /notification/all/{page}:
    get:
      tags:
      - Notification
      summary: Get all notifications
      description: Get all notifications
      operationId: notificationAll
      parameters:
      - $ref: '#/components/parameters/IParameterQueryPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INotificationAllPagedResponse'
      security:
      - token: []
  /notification/friends/{page}:
    get:
      tags:
      - Notification
      summary: Get all friends notifications
      description: Get all friends notifications
      operationId: notificationFriends
      parameters:
      - $ref: '#/components/parameters/IParameterQueryPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/IPagedResponseBase'
                - type: object
                  properties:
                    content:
                      type: array
                      items:
                        $ref: '#/components/schemas/IFriendNotification'
      security:
      - token: []
  /notification/related/release/{page}:
    get:
      tags:
      - Notification
      summary: Get all related releases notifications
      description: Get all related releases notifications
      operationId: notificationRelatedRelease
      parameters:
      - $ref: '#/components/parameters/IParameterQueryPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/IPagedResponseBase'
                - type: object
                  properties:
                    content:
                      type: array
                      items:
                        $ref: '#/components/schemas/IRelatedReleaseNotification'
      security:
      - token: []
  /notification/episodes/{page}:
    get:
      tags:
      - Notification
      summary: Get all episodes notifications
      description: Get all episodes notifications
      operationId: notificationEpisodes
      parameters:
      - $ref: '#/components/parameters/IParameterQueryPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
