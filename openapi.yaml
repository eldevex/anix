      summary: Get all votes of a comment
      description: Get all votes of a comment
      operationId: collectionCommentVotes
      parameters:
      - $ref: '#/components/parameters/IParameterId'
      - $ref: '#/components/parameters/IParameterQueryPage'
      - $ref: '#/components/parameters/ICommentVotesSort'
