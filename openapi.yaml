      type: object
      properties:
        query:
          type: string
        searchBy:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          x-enumNames:
          - Title
          - Studio
          - Director
          - Author
          - Genre
      required:
      - query
      - searchBy
    ISearchRequest:
      type: object
      properties:
        query:
          type: string
        searchBy:
          type: integer
          enum:
