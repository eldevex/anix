components:
  schemas:
    ICollectionCreateRequest:
      properties:
        title:
          type: string
        description:
          type: string
        releases:
          items:
            type: integer
          type: array
        is_private:
          type: boolean
      required:
      - title
      - description
      - releases
      - is_private
      additionalProperties: false
      type: object
    IEditImageRequest:
      type: object
      properties:
        image:
          type: string
          format: binary
          description: The image to upload (.jpg, .png, .gif, .webp)
        name:
          type: string
          example: image
      encoding:
        image:
          contentType: image/jpeg, image/png, image/gif, image/webp
        name:
          contentType: text/plain
    ICommentRequest:
      type: object
      properties:
        parentCommentId:
          type: integer
          nullable: true
          example: null
        replyToProfileId:
          type: integer
          nullable: true
          example: null
        message:
          type: string
        spoiler:
          type: boolean
          example: false
    ICommentEditRequest:
      type: object
      properties:
        message:
          type: string
        spoiler:
          type: boolean
          example: false
    FFilterRequest:
      properties:
        country:
          type: string
          nullable: true
          example: null
          $ref: '#/components/schemas/FCountry'
