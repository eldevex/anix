          application/json:
            schema:
              $ref: '#/components/schemas/ICollectionCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ICollectionCreateEditResponse'
      security:
      - token: []
  /collectionMy/edit/{id}:
    post:
      tags:
      - Collection
      summary: Edit a collection
      description: Edit a collection
      operationId: collectionMyEdit
      parameters:
      - $ref: '#/components/parameters/IParameterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
