  /notification/read:
    get:
      tags:
      - Notification
      summary: Read all notifications
      description: Read all notifications
      operationId: notificationRead
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDefaultResponse'
      security:
      - token: []
  /notification/{type}/delete/{id}:
    get:
      tags:
      - Notification
      summary: Delete a specific notifications
      description: 'Delete a specific notifications


        Note: `related/release` is not working in the docs, because of the url escaping

        '
      operationId: notificationDeleteOne
      parameters:
      - in: path
        name: type
        required: true
        schema:
          enum:
          - friend
          - episode
          - releaseComment
          - collectionComment
          - article
          - related/release
          example: episode
      - $ref: '#/components/parameters/IParameterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDefaultResponse'
      security:
      - token: []
  /notification/delete/all:
    get:
      tags:
      - Notification
      summary: Delete all notifications
      description: Delete all notifications
      operationId: notificationDelete
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDefaultResponse'
      security:
      - token: []
  /collection/all/{page}:
    get:
      tags:
      - Collection
      summary: Get all collections
      description: Get all collections
      operationId: collectionAll
      parameters:
      - $ref: '#/components/parameters/IParameterQueryPage'
      - $ref: '#/components/parameters/IParameterPreviousPage'
      - $ref: '#/components/parameters/ICollectionAllSort'
      - name: where
        in: query
        schema:
          type: number
          example: 1
          required: false
          description: it is always '1' on discovery page. Other values are unknown.
            Otherwise is omitted
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/IPagedResponseBase'
                - type: object
                  properties:
                    content:
                      type: array
                      items:
                        $ref: '#/components/schemas/ICollection'
      security:
      - token: []
