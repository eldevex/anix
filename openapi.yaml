  /release/collection/{id}/random:
    get:
      tags:
      - Collection
      summary: Get a random release of a collection
      description: Get a random release of a collection
      operationId: releaseCollectionRandom
      parameters:
      - $ref: '#/components/parameters/IParameterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IReleaseResponse'
  /filter/{page}:
    post:
      tags:
      - Filter
      summary: Get releases by filter
      description: "Lists of releases on the main page use pre-defined filters.\n```\n
        \   |     Tab     |        Value        |\n    | ----------- | -------------------
        |\n    | Latest      | Default filter      |\n    | Anime       | country:
        \"\u042F\u043F\u043E\u043D\u0438\u044F\"   |\n    | Dunhua      | country:
        \"\u041A\u0438\u0442\u0430\u0439\"    |\n    | Finished    | status_id: 1
        \       |\n    | Ongoing     | status_id: 2        |\n    | Announce    |
        status_id: 3        |\n    | Films       | category_id: 2      |\n    | OVA
        \        | category_id: 3      |\n```\n"
      operationId: getFilter
      parameters:
      - $ref: '#/components/parameters/IParameterQueryPage'
      - $ref: '#/components/parameters/IParameterExtendedMode'
      requestBody:
        required: true
        content:
          application/json:
